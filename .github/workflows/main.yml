name: Auto Sync Fork

on:
  schedule:
    - cron: '10 11 * * *' # S'exécute automatiquement toutes les nuits à minuit
  workflow_dispatch: # Vous permet de lancer la mise à jour manuellement d'un clic

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_ECC }}
          fetch-depth: 0 # Télécharge tout l'historique pour éviter les conflits

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with original repository
        run: |
          git remote add upstream https://github.com
          git fetch upstream main
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "Mise à jour automatique ECC"
          git push origin main
